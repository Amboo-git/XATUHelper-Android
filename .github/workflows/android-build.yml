name: Android unsigned build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36" "build-tools;36.0.0"

      # Release has no signingConfig. Other variants and the packaging
      # script use development signing and must not be built here.
      - name: Build unsigned APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
            app/build/outputs/apk/release/app-x86-release-unsigned.apk
            app/build/outputs/apk/release/app-x86_64-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
